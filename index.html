
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SkillBridge AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrapper">
    <div class="login-box">

        <h1>SkillBridge AI</h1>
        <p class="subtitle">Bridge the Gap Between Learning and Industry</p>

        <h2>Welcome Back!</h2>
        <p class="description">Login to continue your learning journey.</p>

        <form id="loginForm">

            <label for="email">Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <label for="pass">Password</label>

            <div class="password-wrapper">
                <input type="password" id="pass"
                       placeholder="Enter your password" required>

                <button type="button" class="toggle-password"
                        id="togglePassword">Show</button>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember Me
                </label>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                Login
            </button>

        </form>

        <div class="divider">OR</div>

        <button type="button" class="google-btn" id="googleLogin">
            <span class="google-icon">G</span>
            Continue with Google
        </button>

        <button type="button" class="cancel-btn" id="cancelBtn">
            Cancel
        </button>

        <p class="signup-text">
            Don't have an account?
            <a href="Signup.html">Sign Up</a>
        </p>

    </div>
</div>

<script>
const loginForm = document.getElementById("loginForm");
const password = document.getElementById("pass");
const togglePassword = document.getElementById("togglePassword");

togglePassword.addEventListener("click", function() {
    password.type = password.type === "password" ? "text" : "password";
    this.textContent = password.type === "password" ? "Show" : "Hide";
});

// Backend Login API
loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const pass = password.value;
    const loginBtn = document.getElementById("loginBtn");

    if (!email || !pass) {
        alert("Please enter email and password.");
        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    try {
        const response = await fetch("http://127.0.0.1:5000/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "include",
            body: JSON.stringify({
                email: email,
                password: pass
            })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.error || "Login failed.");
            return;
        }

        sessionStorage.setItem("loggedIn", "true");
        sessionStorage.setItem("loginEmail", data.student.email);
        sessionStorage.setItem("studentData", JSON.stringify({
            id: data.student.id,
            name: data.student.name,
            email: data.student.email
        }));

        alert("Login successful!");

        window.location.href = "form.html";

    } catch (error) {
        console.error(error);
        alert("Backend connection failed. Please start Flask server.");
    } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
    }
});

document.getElementById("cancelBtn").addEventListener("click", function() {
    loginForm.reset();
    password.type = "password";
    togglePassword.textContent = "Show";
});

document.getElementById("googleLogin").addEventListener("click", function() {
    alert("Google authentication is not configured yet.");
});
</script>

</body>
</html>
