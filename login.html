
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SkillBridge AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-wrapper">

        <div class="login-box">

            <h1>SkillBridge AI</h1>
            <p class="subtitle">Bridge the Gap Between Learning and Industry</p>

            <h2>Welcome Back!</h2>
            <p class="description">Login to continue your learning journey.</p>

            <form action="/login" method="POST">

                <label for="email">Email Address</label>
                <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="pass">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        name="password"
                        id="pass"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword()"
                    >Show</button>
                </div>

                <div class="options">
                    <label class="remember">
                        <input type="checkbox" name="remember">
                        Remember Me
                    </label>

                    <a href="/forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <a href="/auth/google" class="google-btn">
                <span class="google-icon">G</span>
                Continue with Google
            </a>

            <button
                type="reset"
                class="cancel-btn"
                onclick="document.querySelector('form').reset()"
            >
                Cancel
            </button>

            <p class="signup-text">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

        </div>

    </div>

    <script>
        function togglePassword() {
            const password = document.getElementById("pass");

            if (password.type === "password") {
                password.type = "text";
            } else {
                password.type = "password";
            }
        }
    </script>

</body>
</html>
