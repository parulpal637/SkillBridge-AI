
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | SkillBridge AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="signup-wrapper">
    <div class="signup-box">

        <h1>SkillBridge AI</h1>
        <p class="subtitle">Bridge the Gap Between Learning and Industry</p>

        <h2>Welcome!</h2>
        <p class="description">Create your account to start your learning journey.</p>

        <form id="signupForm">

            <label for="name">Full Name</label>
            <input type="text" id="name" required placeholder="Enter your full name">

            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="Enter your email">

            <label for="pass">Password</label>

            <div class="password-wrapper">
                <input type="password" id="pass" minlength="8"
                       required placeholder="Minimum 8 characters">

                <button type="button" class="toggle-password"
                        onclick="togglePassword()">Show</button>
            </div>

            <button type="submit" class="signup-btn" id="signupBtn">
                Create Account
            </button>

        </form>

        <p id="message"></p>

        <div class="divider"><span>OR</span></div>

        <p class="login-text">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>
</div>

<script>

const API_URL = "https://skillbridge-ai-lep0.onrender.com";

function togglePassword() {
    const pass = document.getElementById("pass");
    pass.type = pass.type === "password" ? "text" : "password";
}

document.getElementById("signupForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const btn = document.getElementById("signupBtn");
    const message = document.getElementById("message");

    const data = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim().toLowerCase(),
        password: document.getElementById("pass").value
    };

    btn.disabled = true;
    btn.textContent = "Creating Account...";
    message.textContent = "";

    try {

        const response = await fetch(`${API_URL}/api/register`, {
            method: "POST",
            credentials: "include",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Registration failed");
        }

        // Store basic student information
        sessionStorage.setItem("studentData", JSON.stringify({
            name: result.student.name,
            email: result.student.email
        }));

        message.style.color = "green";
        message.textContent = "Account created successfully!";

        // Verify that backend session was actually created
        const verifyResponse = await fetch(`${API_URL}/api/profile`, {
            method: "GET",
            credentials: "include"
        });

        if (!verifyResponse.ok) {
            throw new Error(
                "Account created, but login session was not maintained. Please check backend cookie settings."
            );
        }

        message.textContent = "Registration successful! Opening assessment...";

        setTimeout(() => {
            window.location.href = "form.html";
        }, 1000);

    } catch (error) {

        console.error("Signup Error:", error);

        message.style.color = "red";
        message.textContent = error.message;

    } finally {

        btn.disabled = false;
        btn.textContent = "Create Account";

    }

});

</script>

</body>
</html>
